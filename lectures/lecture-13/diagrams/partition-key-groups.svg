<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="title">One partition can contain several key groups</title>
  <desc id="description">This is a one-partition variant of the original two lunch orders. All four emitted pairs go to P0. One possible arrival order is pizza 1, pizza 1, salad 1, pizza 1. Sorting by meal name places the three pizza pairs together, followed by the salad pair. P0 still contains both keys. Reduce task R0 calls the reduce function once with pizza and values 1, 1, 1, producing pizza 3. It calls the function separately with salad and value 1, producing salad 1. A partition is a routing destination, while a key group contains values with one matching key. Routing and sorting preserve all four meal requests.</desc>
  <defs>
    <marker id="flow-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#61716a"/></marker>
  </defs>
  <rect width="1280" height="560" rx="12" fill="#f7f6f2"/>
  <g text-anchor="middle" fill="#20352e">
    <text x="640" y="43" font-size="32" font-weight="650">One partition can contain several key groups</text>
    <text x="640" y="82" font-size="24" fill="#61716a">One-partition variant: all four original lunch pairs go to P0.</text>
    <text x="210" y="134" font-size="25" font-weight="650">1 · P0 receives four pairs</text>
    <text x="640" y="134" font-size="25" font-weight="650">2 · Sort within P0</text>
    <text x="1070" y="134" font-size="25" font-weight="650">3 · R0 calls reduce per key</text>
  </g>
  <g fill="#fff" stroke="#c8d1c9" stroke-width="2">
    <rect x="35" y="155" width="350" height="285" rx="12"/>
    <rect x="465" y="155" width="350" height="285" rx="12"/>
    <rect x="895" y="155" width="350" height="285" rx="12"/>
  </g>
  <g text-anchor="middle" fill="#61716a" font-size="22">
    <text x="210" y="185">One possible arrival order</text>
    <text x="640" y="185">Equal keys become adjacent</text>
    <text x="1070" y="185">Two groups inside the same P0</text>
  </g>

  <g stroke-width="2">
    <g fill="#dce9f0" stroke="#356885">
      <rect x="65" y="205" width="290" height="42" rx="7"/>
      <rect x="65" y="260" width="290" height="42" rx="7"/>
      <rect x="65" y="370" width="290" height="42" rx="7"/>
      <rect x="495" y="205" width="290" height="42" rx="7"/>
      <rect x="495" y="260" width="290" height="42" rx="7"/>
      <rect x="495" y="315" width="290" height="42" rx="7"/>
    </g>
    <g fill="#dcece1" stroke="#30785b">
      <rect x="65" y="315" width="290" height="42" rx="7"/>
      <rect x="495" y="370" width="290" height="42" rx="7"/>
    </g>
  </g>
  <g text-anchor="middle" fill="#20352e" font-size="25">
    <text x="210" y="234">(pizza, 1)</text>
    <text x="210" y="289">(pizza, 1)</text>
    <text x="210" y="344">(salad, 1)</text>
    <text x="210" y="399">(pizza, 1)</text>
    <text x="640" y="234">(pizza, 1)</text>
    <text x="640" y="289">(pizza, 1)</text>
    <text x="640" y="344">(pizza, 1)</text>
    <text x="640" y="399">(salad, 1)</text>
  </g>
  <g fill="none" stroke="#61716a" stroke-width="3" marker-end="url(#flow-arrow)">
    <path d="M 398 300 H 451"/>
    <path d="M 828 300 H 881"/>
  </g>

  <rect x="920" y="205" width="300" height="97" rx="8" fill="#dce9f0" stroke="#356885" stroke-width="2"/>
  <rect x="920" y="315" width="300" height="97" rx="8" fill="#dcece1" stroke="#30785b" stroke-width="2"/>
  <g text-anchor="middle" fill="#20352e">
    <text x="1070" y="240" font-size="26">pizza: [1, 1, 1]</text>
    <text x="1070" y="282" font-size="26" font-weight="650">reduce → (pizza, 3)</text>
    <text x="1070" y="350" font-size="26">salad: [1]</text>
    <text x="1070" y="392" font-size="26" font-weight="650">reduce → (salad, 1)</text>
  </g>
  <g text-anchor="middle" fill="#61716a" font-size="24">
    <text x="640" y="485">Routing chooses P0. Sorting puts equal keys together.</text>
    <text x="640" y="525">R0 makes two reduce calls. All four requests remain represented.</text>
  </g>
</svg>
