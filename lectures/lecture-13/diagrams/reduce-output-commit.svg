<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 580" width="1280" height="580" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="title">Two reduce attempts publish one complete output file</title>
  <desc id="description">This example concerns reduce task R0, not map task M0. Two attempts of R0 process the same pizza group and each write pizza equals 3 to a separate temporary file. Each completed attempt can request an atomic rename to the same final filename. The file system installs one complete file at that name. If both attempts finish, the final file contains one attempt's result. The system does not append or add the two results. Atomic publication prevents readers from seeing a partially installed candidate. It does not make separate external actions happen only once.</desc>
  <defs>
    <marker id="attempt-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#356885"/></marker>
    <marker id="commit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#30785b"/></marker>
  </defs>
  <rect width="1280" height="580" rx="12" fill="#f7f6f2"/>
  <g text-anchor="middle" fill="#20352e">
    <text x="640" y="45" font-size="32" font-weight="650">Reduce retries: publish one complete result</text>
    <text x="640" y="83" font-size="24" fill="#61716a">Both attempts run R0 with the same input and code. Each computes pizza = 3.</text>
    <text x="215" y="135" font-size="25" font-weight="650">1 · Write temporary files</text>
    <text x="650" y="135" font-size="25" font-weight="650">2 · Commit a completed file</text>
    <text x="1080" y="135" font-size="25" font-weight="650">3 · Read the final file</text>
  </g>

  <g fill="#dce9f0" stroke="#356885" stroke-width="2">
    <rect x="40" y="165" width="350" height="120" rx="10"/>
    <rect x="40" y="330" width="350" height="120" rx="10"/>
  </g>
  <g text-anchor="middle" fill="#20352e">
    <text x="215" y="201" font-size="26" font-weight="650">R0 · attempt A</text>
    <text x="215" y="237" font-size="27">pizza = 3</text>
    <text x="215" y="269" font-size="22" fill="#356885">Completed temporary file A</text>
    <text x="215" y="366" font-size="26" font-weight="650">R0 · attempt B</text>
    <text x="215" y="402" font-size="27">pizza = 3</text>
    <text x="215" y="434" font-size="22" fill="#356885">Completed temporary file B</text>
  </g>
  <g fill="none" stroke="#356885" stroke-width="3" marker-end="url(#attempt-arrow)">
    <path d="M 400 225 H 440 V 280 H 490"/>
    <path d="M 400 390 H 440 V 335 H 490"/>
  </g>

  <rect x="500" y="205" width="300" height="205" rx="12" fill="#fff" stroke="#30785b" stroke-width="2"/>
  <g text-anchor="middle" fill="#20352e">
    <text x="650" y="248" font-size="28" font-weight="650" fill="#30785b">Atomic rename</text>
    <text x="650" y="296" font-size="24">The file system installs</text>
    <text x="650" y="330" font-size="24">one complete file</text>
    <text x="650" y="364" font-size="24">at R0’s final filename.</text>
  </g>
  <path d="M 812 307 H 910" fill="none" stroke="#30785b" stroke-width="3" marker-end="url(#commit-arrow)"/>

  <rect x="920" y="205" width="320" height="205" rx="12" fill="#dcece1" stroke="#30785b" stroke-width="2"/>
  <g text-anchor="middle" fill="#20352e">
    <text x="1080" y="248" font-size="28" font-weight="650">Final R0 output</text>
    <text x="1080" y="307" font-size="36" font-weight="650">pizza = 3</text>
    <text x="1080" y="361" font-size="24">One complete result</text>
    <text x="1080" y="392" font-size="22" fill="#30785b">No appending of both copies</text>
  </g>

  <g text-anchor="middle" fill="#61716a" font-size="24">
    <text x="640" y="495">Either attempt can supply the final file. Their contents are never added together.</text>
    <text x="640" y="533">Atomic publication exposes a complete file, not a partially installed result.</text>
  </g>
</svg>
