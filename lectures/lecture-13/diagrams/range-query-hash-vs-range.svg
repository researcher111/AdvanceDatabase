<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="title">A name range searches all hash partitions but only one matching range partition</title>
  <desc id="description">The same twelve names appear under hash partitioning and range partitioning. The inclusive query dee less than or equal to name less than or equal to fay returns dee, eli, and fay. A blue outline marks a partition inspected by the query. A green filled label marks a matching name. A faded dashed outline marks a skipped partition. Hash P0 contains cyd, fay, and ivy. Hash P1 contains ben and kim. Hash P2 contains ada, dee, eli, and lee. Hash P3 contains gus, jon, and mia. The query inspects all four hash partitions because hashing does not preserve name order. The matches occur in P0 and P2. Range P0, a through c, contains ada, ben, and cyd. Range P1, d through f, contains dee, eli, and fay. Range P2, g through j, contains gus, ivy, and jon. Range P3, k through z, contains kim, lee, and mia. The query inspects only range P1 because its d through f interval contains the query interval. The other range partitions cannot contain a matching name and are skipped. Both layouts return the same three names.</desc>
  <defs>
    <style>
      .heading { font-size: 30px; font-weight: 650; }
      .body { font-size: 24px; }
      .name { font-size: 26px; text-anchor: middle; }
      .inspected { fill: #fff; stroke: #356885; stroke-width: 3; }
      .skipped { fill: #eff1ec; stroke: #d1d8d2; stroke-width: 2; stroke-dasharray: 6 5; }
      .match { fill: #dcece1; stroke: #30785b; stroke-width: 2; }
    </style>
  </defs>
  <rect width="1280" height="720" rx="12" fill="#f7f6f2"/>

  <g fill="#20352e" text-anchor="middle">
    <text x="640" y="43" font-size="32" font-weight="650">Same names, different partitions to search</text>
    <text x="640" y="83" font-size="28">Query: dee ≤ name ≤ fay (inclusive)</text>
  </g>

  <g class="body" fill="#20352e">
    <rect x="40" y="110" width="38" height="28" rx="5" class="inspected"/>
    <text x="92" y="133">inspected partition</text>
    <rect x="417" y="106" width="68" height="36" rx="7" class="match"/>
    <text x="451" y="133" text-anchor="middle">eli</text>
    <text x="500" y="133">matching name</text>
    <rect x="864" y="110" width="38" height="28" rx="5" class="skipped"/>
    <text x="916" y="133" fill="#61716a">skipped partition</text>
  </g>

  <path d="M 640 165 V 630" stroke="#d1d8d2" stroke-width="2"/>
  <g text-anchor="middle" fill="#20352e">
    <text x="325" y="187" class="heading">Hash partitioning</text>
    <text x="955" y="187" class="heading">Range partitioning</text>
    <text x="325" y="221" class="body" fill="#356885">Inspect all 4 partitions</text>
    <text x="955" y="221" class="body" fill="#356885">Inspect P1; skip P0, P2, P3</text>
  </g>

  <!-- Hash routing scatters the matching names across P0 and P2. -->
  <g class="inspected">
    <rect x="40" y="246" width="570" height="64" rx="10"/>
    <rect x="40" y="326" width="570" height="64" rx="10"/>
    <rect x="40" y="406" width="570" height="64" rx="10"/>
    <rect x="40" y="486" width="570" height="64" rx="10"/>
  </g>
  <g class="body" fill="#356885" font-weight="650">
    <text x="65" y="286">P0</text>
    <text x="65" y="366">P1</text>
    <text x="65" y="446">P2</text>
    <text x="65" y="526">P3</text>
  </g>
  <g class="match">
    <rect x="267" y="258" width="76" height="40" rx="7"/>
    <rect x="267" y="418" width="76" height="40" rx="7"/>
    <rect x="367" y="418" width="76" height="40" rx="7"/>
  </g>
  <g class="name" fill="#20352e">
    <text x="205" y="287">cyd</text>
    <text x="305" y="287" font-weight="650">fay</text>
    <text x="405" y="287">ivy</text>
    <text x="205" y="367">ben</text>
    <text x="305" y="367">kim</text>
    <text x="205" y="447">ada</text>
    <text x="305" y="447" font-weight="650">dee</text>
    <text x="405" y="447" font-weight="650">eli</text>
    <text x="505" y="447">lee</text>
    <text x="205" y="527">gus</text>
    <text x="305" y="527">jon</text>
    <text x="405" y="527">mia</text>
  </g>

  <!-- Ordered boundaries let the query skip three whole partitions. -->
  <g class="skipped">
    <rect x="670" y="246" width="570" height="64" rx="10"/>
    <rect x="670" y="406" width="570" height="64" rx="10"/>
    <rect x="670" y="486" width="570" height="64" rx="10"/>
  </g>
  <rect x="670" y="326" width="570" height="64" rx="10" class="inspected"/>
  <g class="body" font-weight="650">
    <text x="690" y="286" fill="#78837d">P0 · a–c</text>
    <text x="690" y="366" fill="#356885">P1 · d–f</text>
    <text x="690" y="446" fill="#78837d">P2 · g–j</text>
    <text x="690" y="526" fill="#78837d">P3 · k–z</text>
  </g>
  <g class="match">
    <rect x="892" y="338" width="76" height="40" rx="7"/>
    <rect x="992" y="338" width="76" height="40" rx="7"/>
    <rect x="1092" y="338" width="76" height="40" rx="7"/>
  </g>
  <g class="name" fill="#78837d">
    <text x="930" y="287">ada</text>
    <text x="1030" y="287">ben</text>
    <text x="1130" y="287">cyd</text>
    <text x="930" y="447">gus</text>
    <text x="1030" y="447">ivy</text>
    <text x="1130" y="447">jon</text>
    <text x="930" y="527">kim</text>
    <text x="1030" y="527">lee</text>
    <text x="1130" y="527">mia</text>
  </g>
  <g class="name" fill="#20352e" font-weight="650">
    <text x="930" y="367">dee</text>
    <text x="1030" y="367">eli</text>
    <text x="1130" y="367">fay</text>
  </g>

  <g class="body" fill="#61716a" text-anchor="middle">
    <text x="325" y="590">Hashing does not preserve name order.</text>
    <text x="325" y="623">The interval can match several buckets.</text>
    <text x="955" y="590">Only d–f overlaps this name interval.</text>
    <text x="955" y="623">The other ranges cannot contain a match.</text>
  </g>
  <rect x="40" y="651" width="1200" height="49" rx="9" fill="#e9eee8"/>
  <text x="640" y="684" text-anchor="middle" font-size="27" font-weight="650" fill="#20352e">Both layouts return the same names: dee, eli, fay.</text>
</svg>
