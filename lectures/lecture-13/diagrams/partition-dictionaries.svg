<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 870" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="title">Two partition entries: one shared dictionary or two separate dictionaries</title>
  <desc id="description">Both examples show the state after partitions[0]["pizza"] = [1]. At the top, partitions = [{}] * 2 creates two list entries pointing to the same dictionary A. Both entries therefore show pizza: [1]. At the bottom, partitions = [{} for _ in range(2)] creates two separate dictionaries. Partition 0 points to dictionary A, which contains pizza: [1]. Partition 1 points to dictionary B, which remains empty. An arrow means that a list entry points to a dictionary. It does not mean that data is copied.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#56685f"/></marker>
  </defs>
  <rect width="760" height="870" rx="12" fill="#f7f6f2"/>
  <g fill="#20352e">
    <text x="30" y="34" font-size="22">Same write in each case:</text>
    <text x="30" y="70" font-size="25" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">partitions[0]["pizza"] = [1]</text>
  </g>

  <rect x="16" y="98" width="728" height="330" rx="12" fill="#ffffff" stroke="#d2b9ad" stroke-width="2"/>
  <g fill="#20352e">
    <text x="36" y="135" font-size="27" font-weight="650">1. Shared dictionary</text>
    <text x="36" y="171" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">partitions = [{}] * 2</text>
    <text x="36" y="214" font-size="20" fill="#56685f">List entries</text>
    <text x="444" y="214" font-size="20" fill="#56685f">One dictionary object</text>
  </g>
  <g fill="#edf2f6" stroke="#6d8799" stroke-width="2">
    <rect x="36" y="236" width="244" height="54" rx="8"/>
    <rect x="36" y="326" width="244" height="54" rx="8"/>
  </g>
  <g fill="none" stroke="#56685f" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 280 263 C 346 263 377 283 440 283"/>
    <path d="M 280 353 C 346 353 377 327 440 327"/>
  </g>
  <rect x="444" y="253" width="272" height="104" rx="10" fill="#f5e8df" stroke="#a26446" stroke-width="2"/>
  <g fill="#20352e" text-anchor="middle">
    <text x="158" y="271" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">partitions[0]</text>
    <text x="158" y="361" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">partitions[1]</text>
    <text x="580" y="286" font-size="21" font-weight="650">Dictionary A</text>
    <text x="580" y="328" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{"pizza": [1]}</text>
    <text x="380" y="408" font-size="21">Both entries show pizza. They share one dictionary.</text>
  </g>

  <rect x="16" y="450" width="728" height="402" rx="12" fill="#ffffff" stroke="#afc6b7" stroke-width="2"/>
  <g fill="#20352e">
    <text x="36" y="488" font-size="27" font-weight="650">2. Separate dictionaries</text>
    <text x="36" y="524" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">partitions = [{} for _ in range(2)]</text>
    <text x="36" y="568" font-size="20" fill="#56685f">List entries</text>
    <text x="444" y="568" font-size="20" fill="#56685f">Two dictionary objects</text>
  </g>
  <g fill="#edf2f6" stroke="#6d8799" stroke-width="2">
    <rect x="36" y="607" width="244" height="54" rx="8"/>
    <rect x="36" y="717" width="244" height="54" rx="8"/>
  </g>
  <g fill="none" stroke="#56685f" stroke-width="3" marker-end="url(#arrow)">
    <path d="M 280 634 L 440 634"/>
    <path d="M 280 744 L 440 744"/>
  </g>
  <g fill="#e7f0e9" stroke="#4b7b60" stroke-width="2">
    <rect x="444" y="590" width="272" height="88" rx="10"/>
    <rect x="444" y="700" width="272" height="88" rx="10"/>
  </g>
  <g fill="#20352e" text-anchor="middle">
    <text x="158" y="642" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">partitions[0]</text>
    <text x="158" y="752" font-size="23" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">partitions[1]</text>
    <text x="580" y="620" font-size="21" font-weight="650">Dictionary A</text>
    <text x="580" y="659" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{"pizza": [1]}</text>
    <text x="580" y="730" font-size="21" font-weight="650">Dictionary B</text>
    <text x="580" y="769" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">{}</text>
    <text x="380" y="828" font-size="21">Only partition 0 changes. Partition 1 stays empty.</text>
  </g>
</svg>
