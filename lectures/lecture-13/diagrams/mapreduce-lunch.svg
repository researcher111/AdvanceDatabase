<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 650" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="title">MapReduce counts every meal request</title>
  <desc id="description">Two fictional club lunch orders contain four meal requests. Order 0 is Pizza, pizza! and order 1 is Salad pizza. Map changes the text to lowercase and emits one pair per occurrence. Order 0 emits two separate pizza, 1 pairs. Order 1 emits salad, 1 and pizza, 1. Four arrows route these occurrences to their matching groups. Shuffle gathers pizza values [1, 1, 1] and salad values [1]. Reduce sums each group, producing pizza: 3 and salad: 1. All four requests are counted. Blue marks pizza and green marks salad. Crossing lines do not join.</desc>
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#61716a"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#356885"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#30785b"/></marker>
  </defs>

  <rect width="1280" height="650" rx="12" fill="#f7f6f2"/>
  <g fill="#20352e" text-anchor="middle">
    <text x="640" y="44" font-size="34" font-weight="650">MapReduce counts every meal request</text>
    <text x="640" y="80" font-size="22" fill="#61716a">Toy club lunch: each mention requests one meal.</text>
    <text x="155" y="132" font-size="26" font-weight="650">Input orders</text>
    <text x="455" y="132" font-size="26" font-weight="650">1. Map</text>
    <text x="846" y="132" font-size="26" font-weight="650">2. Shuffle</text>
    <text x="1135" y="132" font-size="26" font-weight="650">3. Reduce</text>
    <text x="155" y="164" font-size="20" fill="#61716a">One record per order</text>
    <text x="455" y="164" font-size="20" fill="#61716a">Emit (meal, 1) pairs</text>
    <text x="846" y="164" font-size="20" fill="#61716a">Group values by meal</text>
    <text x="1135" y="164" font-size="20" fill="#61716a">Sum each group</text>
  </g>

  <!-- Each input record leads to its own two occurrence cards. -->
  <g fill="#ffffff" stroke="#c8d1c9" stroke-width="2">
    <rect x="35" y="217" width="240" height="110" rx="10"/>
    <rect x="35" y="417" width="240" height="110" rx="10"/>
    <rect x="340" y="195" width="230" height="145" rx="10" stroke-dasharray="5 5"/>
    <rect x="340" y="395" width="230" height="145" rx="10" stroke-dasharray="5 5"/>
  </g>
  <g fill="#20352e" text-anchor="middle">
    <text x="155" y="255" font-size="22" font-weight="650">Order 0</text>
    <text x="155" y="295" font-size="24">“Pizza, pizza!”</text>
    <text x="155" y="455" font-size="22" font-weight="650">Order 1</text>
    <text x="155" y="495" font-size="24">“Salad pizza.”</text>
  </g>
  <g fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#arrow-gray)">
    <path d="M 278 272 C 310 272 310 236 350 236"/>
    <path d="M 278 272 C 310 272 310 308 350 308"/>
    <path d="M 278 472 C 310 472 310 436 350 436"/>
    <path d="M 278 472 C 310 472 310 508 350 508"/>
  </g>

  <!-- Repeated pizza requests remain three distinct cards. -->
  <g stroke-width="2">
    <rect x="354" y="210" width="202" height="52" rx="8" fill="#dce9f0" stroke="#356885"/>
    <rect x="354" y="282" width="202" height="52" rx="8" fill="#dce9f0" stroke="#356885"/>
    <rect x="354" y="410" width="202" height="52" rx="8" fill="#dcece1" stroke="#30785b"/>
    <rect x="354" y="482" width="202" height="52" rx="8" fill="#dce9f0" stroke="#356885"/>
  </g>
  <g font-size="24" text-anchor="middle" dominant-baseline="middle" fill="#20352e">
    <text x="455" y="236">(pizza, 1)</text>
    <text x="455" y="308">(pizza, 1)</text>
    <text x="455" y="436">(salad, 1)</text>
    <text x="455" y="508">(pizza, 1)</text>
  </g>

  <!-- Every occurrence has an arrow to its matching group. The cream
       under-stroke makes the single crossing visibly separate paths. -->
  <g fill="none" stroke="#356885" stroke-width="3" marker-end="url(#arrow-blue)">
    <path d="M 558 236 C 625 236 652 264 722 264"/>
    <path d="M 558 308 C 625 308 652 294 722 294"/>
    <path d="M 558 508 C 650 508 636 326 722 326"/>
  </g>
  <path d="M 558 436 C 624 436 658 470 722 470" fill="none" stroke="#f7f6f2" stroke-width="11"/>
  <path d="M 558 436 C 624 436 658 470 722 470" fill="none" stroke="#30785b" stroke-width="3" marker-end="url(#arrow-green)"/>

  <g stroke-width="2">
    <rect x="726" y="238" width="240" height="112" rx="10" fill="#dce9f0" stroke="#356885"/>
    <rect x="726" y="438" width="240" height="90" rx="10" fill="#dcece1" stroke="#30785b"/>
    <rect x="1040" y="254" width="190" height="80" rx="10" fill="#dce9f0" stroke="#356885"/>
    <rect x="1040" y="443" width="190" height="80" rx="10" fill="#dcece1" stroke="#30785b"/>
  </g>
  <g text-anchor="middle" fill="#20352e">
    <text x="846" y="278" font-size="24" font-weight="650">pizza</text>
    <text x="846" y="320" font-size="28">[1, 1, 1]</text>
    <text x="846" y="473" font-size="24" font-weight="650">salad</text>
    <text x="846" y="510" font-size="28">[1]</text>
    <text x="1135" y="304" font-size="30" font-weight="650">pizza: 3</text>
    <text x="1135" y="493" font-size="30" font-weight="650">salad: 1</text>
    <text x="1135" y="368" font-size="21" fill="#356885">1 + 1 + 1 = 3</text>
    <text x="1135" y="557" font-size="21" fill="#30785b">1 = 1</text>
  </g>
  <path d="M 969 294 L 1035 294" stroke="#356885" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <path d="M 969 483 L 1035 483" stroke="#30785b" stroke-width="3" marker-end="url(#arrow-green)"/>

  <rect x="35" y="590" width="1195" height="42" rx="8" fill="#e9eee8"/>
  <text x="632" y="618" text-anchor="middle" font-size="22" fill="#20352e">2 orders → 4 pairs → 2 groups → 2 totals. All 4 meal requests are counted.</text>
</svg>
