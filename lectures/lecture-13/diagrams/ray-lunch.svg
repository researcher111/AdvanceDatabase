<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 680" role="img" aria-labelledby="title description" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
  <title id="title">Ray runs the tasks; our driver combines the counts</title>
  <desc id="description">The driver submits two count_order tasks before waiting. The call for Pizza, pizza! returns reference 0, and the call for Salad pizza. returns reference 1. These references identify future results, not counts. The tasks can run independently. Task 0 returns a dictionary containing pizza: 2. Task 1 returns a dictionary containing salad: 1 and pizza: 1. ray.get(refs) waits for both results. Our driver then loops through both dictionaries and adds matching meal counts, producing pizza: 3 and salad: 1. The merge is explicit application code.</desc>
  <defs>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#61716a"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#356885"/></marker>
  </defs>
  <rect width="1280" height="680" rx="12" fill="#f7f6f2"/>
  <g fill="#20352e" text-anchor="middle">
    <text x="640" y="45" font-size="32" font-weight="650">Ray runs the tasks; our driver combines the counts</text>
    <text x="640" y="81" font-size="22" fill="#61716a">Submit both tasks, get their results, then add matching counts.</text>
    <text x="208" y="138" font-size="25" font-weight="650">1. Driver submits</text>
    <text x="640" y="138" font-size="25" font-weight="650">2. Tasks count</text>
    <text x="1087" y="138" font-size="25" font-weight="650">3. Driver combines</text>
    <text x="640" y="174" font-size="21" fill="#61716a">Neither task waits for the other.</text>
  </g>

  <g stroke="#c8d1c9" stroke-width="2" fill="#fff">
    <rect x="35" y="205" width="345" height="340" rx="12"/>
    <rect x="480" y="205" width="320" height="145" rx="12"/>
    <rect x="480" y="385" width="320" height="160" rx="12"/>
    <rect x="930" y="205" width="315" height="340" rx="12"/>
  </g>
  <g fill="#20352e" text-anchor="middle">
    <text x="208" y="245" font-size="24" font-weight="650">count_order.remote(...)</text>
    <text x="208" y="292" font-size="23">“Pizza, pizza!” → ref 0</text>
    <text x="208" y="339" font-size="23">“Salad pizza.” → ref 1</text>
    <text x="208" y="399" font-size="23" font-weight="650">refs = [ref 0, ref 1]</text>
    <text x="208" y="461" font-size="21" fill="#61716a">A reference identifies a result.</text>
    <text x="208" y="495" font-size="21" fill="#61716a">It is not the result itself.</text>
    <text x="640" y="244" font-size="23" font-weight="650">Task 0 · “Pizza, pizza!”</text>
    <text x="640" y="424" font-size="23" font-weight="650">Task 1 · “Salad pizza.”</text>
    <text x="1087" y="248" font-size="25" font-weight="650">ray.get(refs)</text>
    <text x="1087" y="283" font-size="21" fill="#61716a">Wait for both dictionaries.</text>
    <text x="1087" y="327" font-size="23">Our loop adds each count.</text>
  </g>
  <g fill="none" stroke="#61716a" stroke-width="2.5" marker-end="url(#gray)">
    <path d="M 384 282 C 425 282 431 278 475 278"/>
    <path d="M 384 330 C 429 330 428 464 475 464"/>
    <path d="M 804 278 C 861 278 862 291 925 291"/>
    <path d="M 804 464 C 861 464 862 348 925 348"/>
  </g>
  <g stroke-width="2">
    <rect x="510" y="269" width="260" height="54" rx="8" fill="#dce9f0" stroke="#356885"/>
    <rect x="510" y="449" width="260" height="70" rx="8" fill="#e9eee8" stroke="#61716a"/>
    <rect x="958" y="364" width="258" height="60" rx="8" fill="#dce9f0" stroke="#356885"/>
    <rect x="958" y="444" width="258" height="60" rx="8" fill="#dcece1" stroke="#30785b"/>
  </g>
  <g fill="#20352e" text-anchor="middle">
    <text x="640" y="304" font-size="25">{'pizza': 2}</text>
    <text x="640" y="477" font-size="23">{'salad': 1,</text>
    <text x="640" y="506" font-size="23">'pizza': 1}</text>
    <text x="1087" y="403" font-size="27" font-weight="650">pizza: 2 + 1 = 3</text>
    <text x="1087" y="483" font-size="27" font-weight="650">salad: 1</text>
    <text x="640" y="598" font-size="21" fill="#61716a">The two driver boxes show the same program at different steps.</text>
  </g>
  <rect x="35" y="625" width="1210" height="38" rx="8" fill="#e9eee8"/>
  <text x="640" y="651" text-anchor="middle" font-size="21" fill="#20352e">Ray returns task results. Our Python merge loop produces the final totals.</text>
</svg>
