<svg xmlns="http://www.w3.org/2000/svg" width="840" height="800" viewBox="0 0 840 800" role="img" aria-labelledby="title desc">
  <title id="title">From a MicroDB scan plan to a Ray Data execution plan</title>
  <desc id="desc">MicroDB builds a scan tree with plan_query. ProjectScan reads from SelectScan, which reads from TableScan. Execution initializes the scans with before_first, then calls next and get_val to retrieve rows. Ray Data read_images and map calls build a logical ReadImage to Map process_image plan. Ray optimizes the plan and creates physical operators. A later write_parquet call starts execution. Worker tasks process blocks and write outputs to storage. Building a plan and processing its rows are separate steps in both systems.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4a4742"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#1f1d1a;font-size:24px}.heading{font-size:28px;font-weight:700}.small{font-size:22px;fill:#4a4742}.label{font-weight:700}.line{fill:none;stroke:#4a4742;stroke-width:2;marker-end:url(#arrow)}.box{fill:#d5e6dc;stroke:#9ec3ae;stroke-width:2;rx:10}.code{font-family:Menlo,Consolas,monospace;font-size:22px}</style>
  </defs>
  <rect width="840" height="800" rx="14" fill="#fbf8f2"/>
  <text x="24" y="38" class="heading">Describe the work, then execute the plan.</text>
  <text x="24" y="69" class="small">Both systems separate planning from execution.</text>
  <rect x="24" y="96" width="376" height="614" rx="12" fill="#fff" stroke="#b6b0a6" stroke-width="2"/>
  <rect x="440" y="96" width="376" height="614" rx="12" fill="#fff" stroke="#b6b0a6" stroke-width="2"/>
  <text x="44" y="131" class="label">MicroDB · Lab 5</text>
  <text x="460" y="131" class="label">Ray Data · Lab 11</text>
  <rect x="44" y="154" width="336" height="70" rx="10" fill="#f0eee5" stroke="#b6b0a6" stroke-width="2"/>
  <text x="212" y="183" text-anchor="middle" class="code">plan_query(data)</text>
  <text x="212" y="210" text-anchor="middle" class="small">Build the scan tree</text>
  <path d="M212 224V260" class="line"/>
  <rect x="44" y="268" width="336" height="136" class="box"/>
  <text x="64" y="296" class="small">Scan tree · root at top</text>
  <text x="64" y="328" class="code">ProjectScan[name]</text>
  <text x="64" y="357" class="code">└─ SelectScan[gpa &gt; 35]</text>
  <text x="86" y="386" class="code">└─ TableScan[students]</text>
  <path d="M212 404V452" class="line"/>
  <rect x="44" y="460" width="336" height="88" rx="10" fill="#fde0d2" stroke="#d8a48a" stroke-width="2"/>
  <text x="212" y="489" text-anchor="middle" class="code">before_first()</text>
  <text x="212" y="520" text-anchor="middle" class="code">next() → get_val()</text>
  <path d="M212 548V574" class="line"/>
  <rect x="44" y="582" width="336" height="74" class="box"/>
  <text x="212" y="612" text-anchor="middle">Retrieve matching rows</text>
  <text x="212" y="641" text-anchor="middle" class="small">One row per successful next()</text>
  <text x="212" y="688" text-anchor="middle" class="small">Local scans pass rows.</text>
  <rect x="460" y="154" width="336" height="70" rx="10" fill="#f0eee5" stroke="#b6b0a6" stroke-width="2"/>
  <text x="628" y="183" text-anchor="middle" class="code">read_images(...)</text>
  <text x="628" y="210" text-anchor="middle" class="code">.map(process_image)</text>
  <path d="M628 224V260" class="line"/>
  <rect x="460" y="268" width="336" height="136" class="box"/>
  <text x="480" y="296" class="small">Logical plan · what to do</text>
  <text x="628" y="326" text-anchor="middle" class="code">ReadImage</text>
  <path d="M628 334V357" class="line"/>
  <text x="628" y="386" text-anchor="middle" class="code">Map(process_image)</text>
  <path d="M628 404V452" class="line"/>
  <text x="647" y="437" class="small">Optimize</text>
  <rect x="460" y="460" width="336" height="88" rx="10" fill="#fde0d2" stroke="#d8a48a" stroke-width="2"/>
  <text x="628" y="489" text-anchor="middle">Physical plan · how to run</text>
  <text x="628" y="520" text-anchor="middle" class="small">May combine read and map</text>
  <path d="M628 548V574" class="line"/>
  <rect x="460" y="582" width="336" height="74" class="box"/>
  <text x="628" y="611" text-anchor="middle" class="code">write_parquet(...)</text>
  <text x="628" y="641" text-anchor="middle" class="small">Starts tasks over blocks</text>
  <text x="628" y="688" text-anchor="middle" class="small">Write blocks to storage.</text>
  <text x="24" y="752" class="label">A plan describes the work. Execution produces rows.</text>
  <text x="24" y="783" class="small">MicroDB pulls rows. Ray Data schedules blocks.</text>
</svg>
