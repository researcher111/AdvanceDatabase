<svg xmlns="http://www.w3.org/2000/svg" width="840" height="620" viewBox="0 0 840 620" role="img" aria-labelledby="title desc">
  <title id="title">An ObjectRef identifies a result before it is ready</title>
  <desc id="desc">One image task is shown. First the driver submits a task with remote and receives an ObjectRef named ref without waiting for the task to finish. The driver can continue while a worker processes the image. The same reference identifies the pending result and, later, the completed result managed by Ray. Calling ray.get with ref waits if necessary and returns the actual image as result. The variable ref remains an ObjectRef after retrieval. One RGB pixel of the returned image is shown as 255, 191, 0. Dashed arrows identify the result; the solid green arrow carries the retrieved value.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4a4742"/></marker>
    <marker id="value-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#316a4c"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#1f1d1a;font-size:24px}.heading{font-size:28px;font-weight:700}.small{font-size:22px;fill:#4a4742}.label{font-weight:700}.code{font-family:Menlo,Consolas,monospace;font-size:22px}.line{fill:none;stroke:#4a4742;stroke-width:2;marker-end:url(#arrow)}.ref{fill:none;stroke:#4a4742;stroke-width:2;stroke-dasharray:6 6;marker-end:url(#arrow)}.value{fill:none;stroke:#316a4c;stroke-width:3;marker-end:url(#value-arrow)}</style>
  </defs>
  <rect width="840" height="620" rx="14" fill="#fbf8f2"/>
  <text x="24" y="38" class="heading">A reference now. The image when it is ready.</text>
  <text x="24" y="73" class="small">One image task. The driver keeps the same ObjectRef.</text>
  <text x="44" y="115" class="label">Driver</text>
  <text x="494" y="115" class="label">Ray</text>
  <rect x="24" y="132" width="342" height="112" rx="10" fill="#fde0d2" stroke="#d8a48a" stroke-width="2"/>
  <text x="44" y="167" class="label">1 · Submit with .remote()</text>
  <text x="44" y="203" class="code">ref: ObjectRef R</text>
  <text x="44" y="230" class="small">Returns without waiting.</text>
  <path d="M366 174H466" class="line"/>
  <rect x="474" y="132" width="342" height="112" rx="10" fill="#f0eee5" stroke="#b6b0a6" stroke-width="2"/>
  <text x="494" y="167" class="label">Task submitted</text>
  <text x="494" y="203">Result R: pending</text>
  <text x="494" y="230" class="small">The image is not ready.</text>
  <rect x="24" y="262" width="342" height="112" rx="10" fill="#fde0d2" stroke="#d8a48a" stroke-width="2"/>
  <text x="44" y="297" class="label">2 · Driver can continue</text>
  <text x="44" y="333" class="code">ref: ObjectRef R</text>
  <text x="44" y="360" class="small">Still a reference.</text>
  <path d="M366 318H466" class="ref"/>
  <rect x="474" y="262" width="342" height="112" rx="10" fill="#d5e6dc" stroke="#9ec3ae" stroke-width="2"/>
  <text x="494" y="297" class="label">Worker processes image</text>
  <text x="494" y="333">Result R becomes ready.</text>
  <text x="494" y="360" class="small">Ray manages the result.</text>
  <rect x="24" y="392" width="342" height="148" rx="10" fill="#fff3d6" stroke="#c8ac65" stroke-width="2"/>
  <text x="44" y="427" class="label">3 · Retrieve the image</text>
  <text x="44" y="463" class="code">result = ray.get(ref)</text>
  <text x="44" y="497" class="small">Waits if R is not ready.</text>
  <text x="44" y="524" class="small">result holds the image.</text>
  <path d="M366 448H466" class="ref"/>
  <path d="M474 506H374" class="value"/>
  <rect x="474" y="392" width="342" height="148" rx="10" fill="#d5e6dc" stroke="#9ec3ae" stroke-width="2"/>
  <text x="494" y="427" class="label">Completed result R</text>
  <text x="494" y="463" class="code">[255, 191, 0]</text>
  <text x="494" y="497" class="small">One RGB pixel shown.</text>
  <text x="494" y="524" class="small">Returns the image value.</text>
  <text x="24" y="573" class="label">ref stays an ObjectRef. result is the returned image.</text>
  <text x="24" y="605" class="small">Dashed: identifies the result. Green: retrieved value.</text>
</svg>
