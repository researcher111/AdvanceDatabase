<svg xmlns="http://www.w3.org/2000/svg" width="840" height="470" viewBox="0 0 840 470" role="img" aria-labelledby="title desc">
  <title id="title">More worker machines can run more independent tasks</title>
  <desc id="desc">A driver submits tasks to a Ray cluster. The head node provides cluster management services. Worker nodes supply resources to run tasks and actors. This is a logical view, not a data-transfer route. Eight and eighty concurrent task slots illustrate capacity, not measured performance.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4a4742"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#1f1d1a;font-size:20px}.heading{font-size:25px;font-weight:700}.small{font-size:18px;fill:#4a4742}.label{font-weight:700}.line{fill:none;stroke:#4a4742;stroke-width:2;marker-end:url(#arrow)}.box{fill:#d5e6dc;stroke:#9ec3ae;stroke-width:2;rx:10}</style>
  </defs>
  <rect width="840" height="470" rx="14" fill="#fbf8f2"/>
  <text x="24" y="38" class="heading">The same tasks can use more machines.</text>
  <text x="24" y="69" class="small">Logical view: these arrows do not show the path taken by image data.</text>
  <rect x="24" y="172" width="174" height="112" rx="10" fill="#fde0d2" stroke="#d8a48a" stroke-width="2"/>
  <text x="111" y="209" text-anchor="middle" class="label">Driver</text>
  <text x="111" y="244" text-anchor="middle" class="small">Submits tasks</text>
  <path d="M198 228H258" class="line"/>
  <rect x="266" y="97" width="550" height="264" rx="12" fill="#fff" stroke="#b6b0a6" stroke-width="2"/>
  <text x="288" y="131" class="label">Ray cluster</text>
  <rect x="288" y="150" width="506" height="69" rx="10" fill="#f0eee5" stroke="#b6b0a6" stroke-width="2"/>
  <text x="541" y="178" text-anchor="middle">Head node</text>
  <text x="541" y="205" text-anchor="middle" class="small">Cluster management services</text>
  <rect x="288" y="239" width="242" height="99" class="box"/>
  <text x="409" y="272" text-anchor="middle">Worker node A</text>
  <text x="409" y="307" text-anchor="middle" class="small">Tasks and actors</text>
  <rect x="552" y="239" width="242" height="99" class="box"/>
  <text x="673" y="272" text-anchor="middle">Worker node B</text>
  <text x="673" y="307" text-anchor="middle" class="small">Tasks and actors</text>
  <text x="24" y="407">More available resources → more independent tasks can overlap.</text>
  <text x="24" y="441" class="small">8 slots → 80 slots is a capacity example. Actual speed depends on overhead and data.</text>
</svg>
