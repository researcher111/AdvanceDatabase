<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="title desc">
  <title id="title">Ray Data transforms rows in a pipeline of blocks</title>
  <desc id="desc">Read image files in blocks, apply the ordinary process_image function to each row, then write output blocks. With include_paths set to True, each input row has image and path fields. The function returns processed_image and original_id fields. An input with path 0.png and one RGB pixel of 0, 64, 255 produces original_id 0.png and a processed pixel of 255, 191, 0. The path is shortened for display. Write results to storage instead of collecting every image in driver memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4a4742"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#1f1d1a;font-size:24px}.heading{font-size:28px;font-weight:700}.small{font-size:22px;fill:#4a4742}.label{font-weight:700}.line{fill:none;stroke:#4a4742;stroke-width:2;marker-end:url(#arrow)}.box{fill:#d5e6dc;stroke:#9ec3ae;stroke-width:2;rx:10}.code{font-family:Menlo,Consolas,monospace;font-size:22px}</style>
  </defs>
  <rect width="840" height="520" rx="14" fill="#fbf8f2"/>
  <text x="24" y="38" class="heading">Read → transform → write blocks.</text>
  <text x="24" y="69" class="small">Ray Data schedules ordinary Python functions.</text>
  <rect x="24" y="104" width="220" height="94" rx="10" fill="#f0eee5" stroke="#b6b0a6" stroke-width="2"/>
  <text x="134" y="142" text-anchor="middle">Read image files</text>
  <text x="134" y="174" text-anchor="middle" class="small">Produce blocks</text>
  <path d="M244 151H292" class="line"/>
  <rect x="300" y="104" width="252" height="94" rx="10" fill="#fde0d2" stroke="#d8a48a" stroke-width="2"/>
  <text x="426" y="142" text-anchor="middle" class="code">map(</text>
  <text x="426" y="174" text-anchor="middle" class="code">process_image)</text>
  <path d="M552 151H602" class="line"/>
  <rect x="610" y="104" width="206" height="94" class="box"/>
  <text x="713" y="142" text-anchor="middle">Write blocks</text>
  <text x="713" y="174" text-anchor="middle" class="small">Back to storage</text>
  <text x="24" y="243" class="label">Keep each image’s source path</text>
  <rect x="24" y="267" width="340" height="110" rx="10" fill="#fff" stroke="#b6b0a6" stroke-width="2"/>
  <text x="45" y="299" class="code">path: "0.png"</text><text x="45" y="328" class="code">image:</text><text x="45" y="357" class="code">[0, 64, 255]</text>
  <path d="M364 322H466" class="line"/>
  <rect x="474" y="267" width="342" height="110" rx="10" fill="#fff" stroke="#b6b0a6" stroke-width="2"/>
  <text x="495" y="299" class="code">original_id: "0.png"</text><text x="495" y="328" class="code">processed_image:</text><text x="495" y="357" class="code">[255, 191, 0]</text>
  <text x="24" y="407" class="small">One RGB pixel shown. The path is shortened.</text>
  <path d="M24 430H816" stroke="#e6e1d6" stroke-width="2"/>
  <text x="24" y="471" class="label">write_parquet() keeps results in storage.</text>
  <text x="24" y="502" class="small">original_id links the output to its input file.</text>
</svg>
