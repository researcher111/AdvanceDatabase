<svg xmlns="http://www.w3.org/2000/svg" width="840" height="520" viewBox="0 0 840 520" role="img" aria-labelledby="title desc">
  <title id="title">Ray Data transforms rows in a pipeline of blocks</title>
  <desc id="desc">Read image files in blocks, apply the ordinary process_image function to each row, then write output blocks. With include_paths set to True, each input row has image and path fields. The function returns processed_image and original_id fields. An input with path 0.png and one RGB pixel of 0, 64, 255 produces original_id 0.png and a processed pixel of 255, 191, 0. The path is shortened for display. Write results to storage instead of collecting every image in driver memory.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4a4742"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#1f1d1a;font-size:20px}.heading{font-size:25px;font-weight:700}.small{font-size:18px;fill:#4a4742}.label{font-weight:700}.line{fill:none;stroke:#4a4742;stroke-width:2;marker-end:url(#arrow)}.box{fill:#d5e6dc;stroke:#9ec3ae;stroke-width:2;rx:10}.code{font-family:Menlo,Consolas,monospace;font-size:18px}</style>
  </defs>
  <rect width="840" height="520" rx="14" fill="#fbf8f2"/>
  <text x="24" y="38" class="heading">Move blocks through a pipeline.</text>
  <text x="24" y="69" class="small">Ray Data schedules the work. The row function stays ordinary Python.</text>
  <rect x="24" y="104" width="130" height="94" rx="10" fill="#f0eee5" stroke="#b6b0a6" stroke-width="2"/>
  <text x="89" y="145" text-anchor="middle">Image files</text><text x="89" y="174" text-anchor="middle" class="small">In storage</text>
  <path d="M154 151H184" class="line"/>
  <rect x="192" y="104" width="150" height="94" class="box"/>
  <text x="267" y="145" text-anchor="middle">Read blocks</text><text x="267" y="174" text-anchor="middle" class="small">Groups of rows</text>
  <path d="M342 151H373" class="line"/>
  <rect x="381" y="104" width="226" height="94" rx="10" fill="#fde0d2" stroke="#d8a48a" stroke-width="2"/>
  <text x="494" y="142" text-anchor="middle" class="code">map(process_image)</text><text x="494" y="174" text-anchor="middle" class="small">Transform each row</text>
  <path d="M607 151H641" class="line"/>
  <rect x="648" y="104" width="168" height="94" class="box"/>
  <text x="732" y="145" text-anchor="middle">Write blocks</text><text x="732" y="174" text-anchor="middle" class="small">Back to storage</text>
  <text x="24" y="243" class="label">Keep the source path with the processed image</text>
  <rect x="24" y="267" width="340" height="110" rx="10" fill="#fff" stroke="#b6b0a6" stroke-width="2"/>
  <text x="45" y="299" class="code">path: "0.png"</text><text x="45" y="328" class="code">image:</text><text x="45" y="357" class="code">[0, 64, 255]</text>
  <path d="M364 322H466" class="line"/>
  <rect x="474" y="267" width="342" height="110" rx="10" fill="#fff" stroke="#b6b0a6" stroke-width="2"/>
  <text x="495" y="299" class="code">original_id: "0.png"</text><text x="495" y="328" class="code">processed_image:</text><text x="495" y="357" class="code">[255, 191, 0]</text>
  <text x="24" y="407" class="small">One RGB pixel shown. The source path is shortened for display.</text>
  <path d="M24 430H816" stroke="#e6e1d6" stroke-width="2"/>
  <text x="24" y="471" class="label">Write output blocks to storage with write_parquet().</text>
  <text x="24" y="502" class="small">Use original_id to match each output to its input file.</text>
</svg>
