<svg xmlns="http://www.w3.org/2000/svg" width="840" height="600" viewBox="0 0 840 600" role="img" aria-labelledby="title desc">
  <title id="title">The driver and worker have separate copies of a global variable</title>
  <desc id="desc">Four images each contain 100 pixels. The driver initializes its own total_pixels_processed variable to zero. A Ray worker has a different copy of that variable. Each task adds 100 to its worker's copy and returns only the processed image. Image inputs move from the driver to workers. Processed images return to the driver, but worker counts are not returned or merged. After ray.get waits for all four image results, the driver still prints zero instead of the expected 400. One worker copy is shown for illustration. Ray may reuse worker processes, so worker-local totals depend on scheduling.</desc>
  <defs>
    <marker id="input-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#a75c35"/></marker>
    <marker id="image-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#316a4c"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#1f1d1a;font-size:24px}.heading{font-size:28px;font-weight:700}.small{font-size:22px;fill:#4a4742}.label{font-size:26px;font-weight:700}.code{font-family:Menlo,Consolas,monospace;font-size:22px}.value{font-family:Menlo,Consolas,monospace;font-size:36px;font-weight:700}.result{font-size:30px;font-weight:700}</style>
  </defs>
  <rect width="840" height="600" rx="14" fill="#fbf8f2"/>
  <text x="24" y="38" class="heading">The same name does not mean shared memory.</text>
  <text x="24" y="71" class="small">Four 10 × 10 images. Each task adds 100 pixels.</text>
  <rect x="24" y="105" width="346" height="280" rx="12" fill="#fde0d2" stroke="#d8a48a" stroke-width="2"/>
  <text x="197" y="147" class="label" text-anchor="middle">Driver memory</text>
  <text x="197" y="191" class="code" text-anchor="middle">total_pixels_processed</text>
  <text x="197" y="240" class="value" text-anchor="middle">= 0</text>
  <text x="197" y="291" text-anchor="middle">Main script reads</text>
  <text x="197" y="325" text-anchor="middle">this copy.</text>
  <rect x="470" y="105" width="346" height="280" rx="12" fill="#d5e6dc" stroke="#9ec3ae" stroke-width="2"/>
  <text x="643" y="147" class="label" text-anchor="middle">Worker memory</text>
  <text x="643" y="191" class="code" text-anchor="middle">total_pixels_processed</text>
  <text x="643" y="240" class="value" text-anchor="middle">+= 100</text>
  <text x="643" y="291" text-anchor="middle">Each task changes</text>
  <text x="643" y="325" text-anchor="middle">this different copy.</text>
  <text x="420" y="187" class="small" text-anchor="middle">Input</text>
  <path d="M380 205H460" fill="none" stroke="#a75c35" stroke-width="3" marker-end="url(#input-arrow)"/>
  <text x="420" y="332" class="small" text-anchor="middle">Image</text>
  <path d="M460 350H380" fill="none" stroke="#316a4c" stroke-width="3" marker-end="url(#image-arrow)"/>
  <rect x="24" y="425" width="792" height="130" rx="12" fill="#fff3d6" stroke="#c8ac65" stroke-width="2"/>
  <text x="420" y="459" text-anchor="middle">After ray.get waits for all four image results:</text>
  <text x="210" y="504" class="result" text-anchor="middle" style="fill:#b84945">Driver count: 0</text>
  <text x="620" y="504" class="result" text-anchor="middle">Expected: 400</text>
  <text x="420" y="538" class="small" text-anchor="middle">Worker counts are not returned or merged.</text>
  <text x="24" y="584" class="small">One worker copy is shown. Ray can reuse worker processes.</text>
</svg>
