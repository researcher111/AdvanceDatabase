<svg xmlns="http://www.w3.org/2000/svg" width="840" height="490" viewBox="0 0 840 490" role="img" aria-labelledby="title desc">
  <title id="title">Submit independent tasks before collecting results</title>
  <desc id="desc">Three of eight images are shown. A serial loop finishes A before starting B, then C. Ray submits all eight process_image tasks first. Available workers can overlap independent tasks. One ray.get call collects result_refs in input order. Each task includes an artificial one-second wait.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4a4742"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#1f1d1a;font-size:20px}.heading{font-size:25px;font-weight:700}.small{font-size:18px;fill:#4a4742}.label{font-weight:700}.line{fill:none;stroke:#4a4742;stroke-width:2;marker-end:url(#arrow)}.box{stroke:#9ec3ae;stroke-width:2;fill:#d5e6dc;rx:10}.code{font-family:Menlo,Consolas,monospace;font-size:19px}</style>
  </defs>
  <rect width="840" height="490" rx="14" fill="#fbf8f2"/>
  <text x="24" y="38" class="heading">Submit first. Collect afterward.</text>
  <text x="24" y="69" class="small">Three of eight images shown. Each call includes a one-second artificial wait.</text>
  <text x="24" y="114" class="label">Serial loop</text>
  <rect x="170" y="86" width="150" height="62" class="box"/><text x="245" y="124" text-anchor="middle">Image A</text>
  <path d="M320 117H358" class="line"/>
  <rect x="365" y="86" width="150" height="62" class="box"/><text x="440" y="124" text-anchor="middle">Image B</text>
  <path d="M515 117H553" class="line"/>
  <rect x="560" y="86" width="150" height="62" class="box"/><text x="635" y="124" text-anchor="middle">Image C</text>
  <path d="M710 117H786" class="line"/>
  <text x="170" y="180" class="small">Each call finishes before the next call starts.</text>
  <path d="M24 206H816" stroke="#e6e1d6" stroke-width="2"/>
  <text x="24" y="246" class="label">Ray tasks</text>
  <rect x="24" y="285" width="206" height="105" rx="10" fill="#fde0d2" stroke="#d8a48a" stroke-width="2"/>
  <text x="127" y="318" text-anchor="middle">Submit all 8 tasks</text>
  <text x="127" y="351" text-anchor="middle" class="small">Keep their ObjectRefs</text>
  <path d="M230 337H255M255 281V393" fill="none" stroke="#4a4742" stroke-width="2"/>
  <path d="M255 281H283" class="line"/><path d="M255 337H283" class="line"/><path d="M255 393H283" class="line"/>
  <rect x="290" y="257" width="168" height="48" class="box"/><text x="374" y="289" text-anchor="middle">Image A</text>
  <rect x="290" y="313" width="168" height="48" class="box"/><text x="374" y="345" text-anchor="middle">Image B</text>
  <rect x="290" y="369" width="168" height="48" class="box"/><text x="374" y="401" text-anchor="middle">Image C</text>
  <path d="M458 281H504V393H458M458 337H504" fill="none" stroke="#4a4742" stroke-width="2"/>
  <path d="M504 337H550" class="line"/>
  <rect x="558" y="285" width="258" height="105" rx="10" fill="#fff3d6" stroke="#c8ac65" stroke-width="2"/>
  <text x="687" y="318" text-anchor="middle" class="code">ray.get(result_refs)</text>
  <text x="687" y="351" text-anchor="middle" class="small">Collect all 8 results</text>
  <text x="24" y="461" class="small">Available resources determine how many tasks can run together.</text>
</svg>
