<svg xmlns="http://www.w3.org/2000/svg" width="840" height="570" viewBox="0 0 840 570" role="img" aria-labelledby="title desc">
  <title id="title">One actor owns the pixel count</title>
  <desc id="desc">Eight process_image_with_actor tasks send 100-pixel updates to the same PixelCounter actor. The actor owns total_pixels. Each 10 by 10 RGB image contains 100 pixels and 300 channel values. Every image task counts its pixels, submits an actor update, and waits for that update before inverting and returning its image. After all image tasks return, the driver reads 800 pixels.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4a4742"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#1f1d1a;font-size:20px}.heading{font-size:25px;font-weight:700}.small{font-size:18px;fill:#4a4742}.label{font-weight:700}.line{fill:none;stroke:#4a4742;stroke-width:2;marker-end:url(#arrow)}.box{fill:#d5e6dc;stroke:#9ec3ae;stroke-width:2;rx:10}.code{font-family:Menlo,Consolas,monospace;font-size:18px}</style>
  </defs>
  <rect width="840" height="570" rx="14" fill="#fbf8f2"/>
  <text x="24" y="38" class="heading">One actor owns the count.</text>
  <text x="24" y="69" class="small">One 10 × 10 RGB image: 100 pixels and 300 channel values.</text>
  <rect x="24" y="100" width="190" height="50" class="box"/><text x="119" y="133" text-anchor="middle">Image A: +100</text>
  <rect x="24" y="170" width="190" height="50" class="box"/><text x="119" y="203" text-anchor="middle">Image B: +100</text>
  <rect x="24" y="240" width="190" height="50" class="box"/><text x="119" y="273" text-anchor="middle">Image H: +100</text>
  <text x="119" y="237" text-anchor="middle" class="small">⋮</text>
  <path d="M214 125H265V178H310" class="line"/>
  <path d="M214 195H310" class="line"/>
  <path d="M214 265H265V212H310" class="line"/>
  <rect x="318" y="111" width="330" height="168" rx="12" fill="#fde0d2" stroke="#d8a48a" stroke-width="2"/>
  <text x="483" y="151" text-anchor="middle" class="code">PixelCounter</text>
  <text x="483" y="187" text-anchor="middle" class="code">total_pixels</text>
  <text x="483" y="230" text-anchor="middle" class="label">0 → 100 → … → 800</text>
  <text x="674" y="175" class="small">8 updates</text>
  <text x="674" y="204" class="small">One total</text>
  <path d="M24 316H816" stroke="#e6e1d6" stroke-width="2"/>
  <text x="24" y="352" class="label">Inside each image task</text>
  <rect x="24" y="375" width="160" height="74" class="box"/><text x="104" y="418" text-anchor="middle">Count pixels</text>
  <path d="M184 412H218" class="line"/>
  <rect x="225" y="375" width="178" height="74" rx="10" fill="#fde0d2" stroke="#d8a48a" stroke-width="2"/>
  <text x="314" y="406" text-anchor="middle" class="code">add.remote(100)</text><text x="314" y="433" text-anchor="middle" class="small">Submit update</text>
  <path d="M403 412H437" class="line"/>
  <rect x="444" y="375" width="178" height="74" rx="10" fill="#fff3d6" stroke="#c8ac65" stroke-width="2"/>
  <text x="533" y="406" text-anchor="middle" class="code">ray.get(...)</text><text x="533" y="433" text-anchor="middle" class="small">Wait for add()</text>
  <path d="M622 412H656" class="line"/>
  <rect x="663" y="375" width="153" height="74" class="box"/><text x="739" y="406" text-anchor="middle" class="small">Invert image</text><text x="739" y="433" text-anchor="middle" class="small">Return image</text>
  <text x="24" y="499" class="label">Driver</text>
  <text x="24" y="535">Wait for all image tasks → read the actor’s total → 800 pixels</text>
</svg>
