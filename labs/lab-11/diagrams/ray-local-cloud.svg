<svg xmlns="http://www.w3.org/2000/svg" width="840" height="666" viewBox="0 0 840 666" role="img" aria-labelledby="title desc">
  <title id="title">The same Ray code can run locally or on a cloud cluster</title>
  <desc id="desc">The standalone stage2_actor.py contains the driver, image task, and counter actor. Run that program locally with ray.init. A separate my-cluster.yaml file describes the AWS region, node types, and worker count. Ray up creates the configured cluster. Ray submit sends the driver program to the cluster, where it can connect with address auto and use the same task and actor logic. The illustrated cluster has one head and ten workers. Code and dependencies must be available on workers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#4a4742"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#1f1d1a;font-size:20px}.heading{font-size:25px;font-weight:700}.small{font-size:18px;fill:#4a4742}.label{font-weight:700}.line{fill:none;stroke:#4a4742;stroke-width:2;marker-end:url(#arrow)}.code{font-family:Menlo,Consolas,monospace;font-size:18px}</style>
  </defs>
  <rect width="840" height="666" rx="14" fill="#fbf8f2"/>
  <text x="24" y="38" class="heading">The same program can use more machines.</text>
  <text x="24" y="69" class="small">Python defines the work. YAML describes the cluster.</text>
  <rect x="24" y="100" width="350" height="145" rx="12" fill="#d5e6dc" stroke="#9ec3ae" stroke-width="2"/>
  <text x="199" y="137" text-anchor="middle" class="code">stage2_actor.py</text>
  <text x="199" y="181" text-anchor="middle" class="code">PixelCounter + task</text>
  <text x="199" y="217" text-anchor="middle" class="small">Driver + Ray functions</text>
  <rect x="466" y="100" width="350" height="145" rx="12" fill="#fde0d2" stroke="#d8a48a" stroke-width="2"/>
  <text x="641" y="137" text-anchor="middle" class="code">my-cluster.yaml</text>
  <text x="641" y="181" text-anchor="middle">AWS region and node types</text>
  <text x="641" y="217" text-anchor="middle" class="small">How many workers to provide</text>
  <path d="M199 245V382" class="line"/>
  <text x="43" y="320" class="small">Run locally</text>
  <path d="M374 206H420V354H544V382" class="line"/>
  <text x="435" y="330" class="code">ray submit</text>
  <path d="M650 245V382" class="line"/>
  <text x="670" y="320" class="code">ray up</text>
  <rect x="24" y="390" width="350" height="180" rx="12" fill="#fff" stroke="#b6b0a6" stroke-width="2"/>
  <text x="199" y="430" text-anchor="middle" class="label">Local machine</text>
  <text x="199" y="475" text-anchor="middle" class="code">ray.init()</text>
  <text x="199" y="535" text-anchor="middle">Tasks run on this machine.</text>
  <rect x="466" y="390" width="350" height="180" rx="12" fill="#fff" stroke="#b6b0a6" stroke-width="2"/>
  <text x="641" y="430" text-anchor="middle" class="label">Cloud cluster</text>
  <text x="641" y="475" text-anchor="middle" class="code">ray.init(address="auto")</text>
  <text x="641" y="535" text-anchor="middle">1 head + 10 workers</text>
  <text x="24" y="615" class="label">Same task and actor logic; cluster setup changes.</text>
  <text x="24" y="647" class="small">Code and dependencies must be available on workers.</text>
</svg>
